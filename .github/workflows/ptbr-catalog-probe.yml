name: Probe PT-BR Catalog Metadata

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ptbr-catalog-probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect localized catalog shape
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error
          base="https://tmdb.elfhosted.com/N4IgNghgdg5grhGBTEAuEAHALgWgEIBKIAvkA"
          routes=[
            "/manifest.json",
            "/meta/movie/tmdb:969681.json",
            "/meta/movie/tt0074285.json",
            "/meta/series/tmdb:1399.json",
            "/catalog/movie/top/genre=Horror.json",
            "/catalog/movie/top/genre=Action.json",
            "/catalog/series/top/genre=Crime.json",
            "/catalog/movie/top/genre=Documentary.json",
            "/catalog/movie/year/genre=2026.json",
          ]
          for route in routes:
            try:
              url=base+route
              req=urllib.request.Request(url,headers={"User-Agent":"FelipeVideosKodiMetadataProbe/1.0","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=13) as response:
                raw=response.read(600000)
                payload=json.loads(raw)
                if route=="/manifest.json":
                  print("MANIFEST",[(x.get("id"),x.get("type"),x.get("name")) for x in payload.get("catalogs",[])[:14]])
                if route.startswith("/meta/"):
                  m=payload.get("meta") or {}
                  print("DETAIL",route,{"id":m.get("id"),"imdb_id":m.get("imdb_id"),"name":m.get("name"),"description":str(m.get("description",""))[:170],"keys":list(m.keys())[:35]})
                items=payload.get("metas",[])
                print("RESULT",route,"http",response.status,"count",len(items))
                for item in items[:2]:
                  print("META",{"id":item.get("imdb_id") or item.get("id"),"name":item.get("name"),"description":str(item.get("description",""))[:120]})
            except Exception as e:
              print("FAIL",route,type(e).__name__,str(e)[:130])
          PY
