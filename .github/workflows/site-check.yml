name: Check Kodi public URLs

on:
  push:
    branches: [main]
    paths: [".github/workflows/site-check.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe GitHub Pages and verify repository catalog
        run: |
          python - <<'PY'
          import hashlib
          import urllib.request
          import xml.etree.ElementTree as ET
          from zipfile import ZipFile
          from io import BytesIO
          root = "https://flyghtxmz.github.io/kodi-repo/"
          paths = ["", "addons.xml", "addons.xml.md5", "repository.flyghtxmz-1.0.1.zip", "plugin.video.flyghtxmz/plugin.video.flyghtxmz-1.1.0.zip"]
          data = {}
          for path in paths:
              url = root + path
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Kodi/21.2"}),timeout=20) as response:
                      body=response.read()
                      data[path]=body
                      print(f"OK {response.status} {url} ({len(body)} bytes, content-type {response.headers.get('Content-Type')})")
              except Exception as e:
                  print(f"FAILED {url}: {repr(e)}")
                  raise
          addons = ET.fromstring(data["addons.xml"])
          actual = hashlib.md5(data["addons.xml"]).hexdigest()
          recorded = data["addons.xml.md5"].decode().strip()
          print(f"CHECKSUM expected={recorded} actual={actual} verified={actual==recorded}")
          assert actual==recorded
          assert {a.attrib["id"] for a in addons.findall("addon")}=={"repository.flyghtxmz","plugin.video.flyghtxmz"}
          for path in paths[3:]:
              with ZipFile(BytesIO(data[path])) as archive:
                  print(f"ZIP {path}: {archive.namelist()}, corruption: {archive.testzip()}")
                  assert archive.testzip() is None
                  repo_id = path.rsplit("/",1)[-1].rsplit("-",1)[0]
                  addon = ET.fromstring(archive.read(repo_id+"/addon.xml"))
                  assert addon.attrib["id"]==repo_id
          print("ALL_URL_CHECKS_PASSED")
          PY
