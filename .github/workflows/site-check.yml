name: Check Kodi public URLs

on:
  push:
    branches: [main]
    paths: [".github/workflows/site-check.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Pages installer and raw GitHub catalog
        run: |
          python - <<'PY'
          import hashlib
          import time
          import urllib.request
          import xml.etree.ElementTree as ET
          from zipfile import ZipFile
          from io import BytesIO

          pages = "https://flyghtxmz.github.io/kodi-repo/"
          raw = "https://raw.githubusercontent.com/flyghtxmz/kodi-repo/main/"
          repo_zip = "repository.flyghtxmz-1.0.3.zip"
          addon_zip = "plugin.video.flyghtxmz/plugin.video.flyghtxmz-1.5.3.zip"

          def get(url):
              with urllib.request.urlopen(urllib.request.Request(
                  url, headers={"User-Agent": "Kodi/21.2"}), timeout=20) as response:
                  content = response.read()
                  print(f"OK {response.status} {url} ({len(content)} bytes)")
                  return content

          # Pages pode estar alguns instantes atrasado em relação ao build do ZIP.
          for attempt in range(12):
              index_html = get(pages).decode("utf-8")
              if repo_zip in index_html and addon_zip in index_html:
                  break
              print("WAIT_PAGES_DEPLOYMENT", attempt + 1)
              time.sleep(8)
          else:
              raise AssertionError("Páginas ainda não publicaram o instalador esperado")

          for origin in (pages, raw):
              xml_data = get(origin + "addons.xml")
              checksum = get(origin + "addons.xml.md5").decode("ascii").strip()
              assert hashlib.md5(xml_data).hexdigest() == checksum
              addons = ET.fromstring(xml_data)
              assert {a.attrib["id"] for a in addons.findall("addon")} == {
                  "repository.flyghtxmz", "plugin.video.flyghtxmz"}
              repo = next(x for x in addons if x.get("id") == "repository.flyghtxmz")
              assert repo.get("version") == "1.0.3"
              directory = repo.find("./extension[@point='xbmc.addon.repository']/dir")
              assert directory.findtext("info") == raw + "addons.xml"
              assert directory.findtext("checksum") == raw + "addons.xml.md5"
              assert directory.findtext("datadir") == raw
              print("VALID_CATALOG", origin)

              for path in (repo_zip, addon_zip):
                  with ZipFile(BytesIO(get(origin + path))) as archive:
                      assert archive.testzip() is None
                      addon_id = path.rsplit("/", 1)[-1].rsplit("-", 1)[0]
                      manifest = ET.fromstring(archive.read(addon_id + "/addon.xml"))
                      assert manifest.get("id") == addon_id
                      print("VALID_ZIP", origin + path)

          print("ALL_URL_CHECKS_PASSED")
          PY
